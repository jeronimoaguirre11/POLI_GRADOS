# Puerta de entrada unica del proyecto: todo el trafico externo pasa por aqui.
#
# Mantiene los MISMOS puertos que ya usan el CORS del gateway y las URLs de
# los frontends (3000 = API y GraphQL, 5173-5181 = frontends), asi que no hay
# que tocar codigo. Ni el gateway ni los frontends publican puertos: solo
# nginx es accesible desde fuera de la red de Docker.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;
  sendfile      on;

  # Subidas de archivos (hojas de vida, imagenes de oferta). El valor por
  # defecto de nginx (1 MB) las rechazaria con 413.
  client_max_body_size 25m;

  # DNS interno de Docker. Con esto nginx vuelve a resolver los nombres de
  # servicio y sigue funcionando cuando un contenedor se recrea con otra IP
  # (por ejemplo, despues de "docker compose up -d --build gateway").
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Conexiones WebSocket: si el cliente pide "Upgrade", se mantiene.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # API: gateway (REST + GraphQL en /graphql)
  server {
    listen 3000;
    set $destino http://gateway:3000;
    location / {
      proxy_pass $destino;
      include /etc/nginx/proxy.conf;
    }
  }

  # frontend-auth
  server {
    listen 5173;
    set $destino http://frontend-auth:80;
    location / {
      proxy_pass $destino;
      include /etc/nginx/proxy.conf;
    }
  }

  # frontend-empresas
  server {
    listen 5174;
    set $destino http://frontend-empresas:80;
    location / {
      proxy_pass $destino;
      include /etc/nginx/proxy.conf;
    }
  }

  # frontend-estudiantes
  server {
    listen 5175;
    set $destino http://frontend-estudiantes:80;
    location / {
      proxy_pass $destino;
      include /etc/nginx/proxy.conf;
    }
  }

  # frontend-postulaciones
  server {
    listen 5176;
    set $destino http://frontend-postulaciones:80;
    location / {
      proxy_pass $destino;
      include /etc/nginx/proxy.conf;
    }
  }

  # frontend-coordinadores
  server {
    listen 5177;
    set $destino http://frontend-coordinadores:80;
    location / {
      proxy_pass $destino;
      include /etc/nginx/proxy.conf;
    }
  }

  # frontend-diplomado
  server {
    listen 5178;
    set $destino http://frontend-diplomado:80;
    location / {
      proxy_pass $destino;
      include /etc/nginx/proxy.conf;
    }
  }

  # frontend-investigacion
  server {
    listen 5179;
    set $destino http://frontend-investigacion:80;
    location / {
      proxy_pass $destino;
      include /etc/nginx/proxy.conf;
    }
  }

  # frontend-docentes
  server {
    listen 5180;
    set $destino http://frontend-docentes:80;
    location / {
      proxy_pass $destino;
      include /etc/nginx/proxy.conf;
    }
  }

  # frontend-administracion
  server {
    listen 5181;
    set $destino http://frontend-administracion:80;
    location / {
      proxy_pass $destino;
      include /etc/nginx/proxy.conf;
    }
  }

}