# docentes-service: Perfil docente y estudiantes asignados.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docentes-service
  labels:
    app: docentes-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docentes-service
  template:
    metadata:
      labels:
        app: docentes-service
    spec:
      # Sin las variables automaticas *_SERVICE_HOST/_PORT de Kubernetes: los
      # servicios usan sus propias URLs (*_SERVICE_URL), igual que en compose.
      enableServiceLinks: false
      initContainers:
        # Espera a que PostgreSQL acepte conexiones antes de correr las
        # migraciones (equivale al depends_on: service_healthy de compose).
        - name: esperar-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo esperando postgres; sleep 2; done"]
      containers:
        - name: docentes-service
          # Imagen construida con "docker compose build" (no se descarga).
          image: poli-grados-docentes-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3008
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: poli-grados-secretos
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poli-grados-secretos
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres:5432/docentes_db?schema=public"
            - name: DIPLOMADO_SERVICE_URL
              value: "http://diplomado-service:3006"
            - name: ESTUDIANTES_SERVICE_URL
              value: "http://estudiantes-service:3003"
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: poli-grados-secretos
                  key: INTERNAL_API_KEY
            - name: INVESTIGACION_SERVICE_URL
              value: "http://investigacion-service:3007"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: poli-grados-secretos
                  key: JWT_SECRET
            - name: PORT
              value: "3008"
            - name: POSTULACIONES_SERVICE_URL
              value: "http://postulaciones-service:3004"
          readinessProbe:
            httpGet:
              path: /health
              port: 3008
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3008
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
---
# Solo accesible dentro del cluster, por el nombre del servicio (igual que en
# la red interna de docker compose).
apiVersion: v1
kind: Service
metadata:
  name: docentes-service
spec:
  selector:
    app: docentes-service
  ports:
    - port: 3008
      targetPort: 3008
