# coordinadores-service: Panel y reportes PDF de coordinacion (sin base de datos).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinadores-service
  labels:
    app: coordinadores-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinadores-service
  template:
    metadata:
      labels:
        app: coordinadores-service
    spec:
      # Sin las variables automaticas *_SERVICE_HOST/_PORT de Kubernetes: los
      # servicios usan sus propias URLs (*_SERVICE_URL), igual que en compose.
      enableServiceLinks: false
      containers:
        - name: coordinadores-service
          # Imagen construida con "docker compose build" (no se descarga).
          image: poli-grados-coordinadores-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3005
          env:
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:3001"
            - name: DOCENTES_SERVICE_URL
              value: "http://docentes-service:3008"
            - name: EMPRESAS_SERVICE_URL
              value: "http://empresas-service:3002"
            - name: ESTUDIANTES_SERVICE_URL
              value: "http://estudiantes-service:3003"
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: poli-grados-secretos
                  key: INTERNAL_API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: poli-grados-secretos
                  key: JWT_SECRET
            - name: PORT
              value: "3005"
            - name: POSTULACIONES_SERVICE_URL
              value: "http://postulaciones-service:3004"
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
---
# Solo accesible dentro del cluster, por el nombre del servicio (igual que en
# la red interna de docker compose).
apiVersion: v1
kind: Service
metadata:
  name: coordinadores-service
spec:
  selector:
    app: coordinadores-service
  ports:
    - port: 3005
      targetPort: 3005
