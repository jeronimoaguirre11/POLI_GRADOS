# frontend-coordinadores: React compilado y servido por nginx (puerto 80 del contenedor).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-coordinadores
  labels:
    app: frontend-coordinadores
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-coordinadores
  template:
    metadata:
      labels:
        app: frontend-coordinadores
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend-coordinadores
          image: poli-grados-frontend-coordinadores:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
---
# LoadBalancer: Docker Desktop lo publica en http://localhost:5177, la misma
# URL de docker compose (las VITE_* quedan igual y no hay que reconstruir).
apiVersion: v1
kind: Service
metadata:
  name: frontend-coordinadores
spec:
  type: LoadBalancer
  selector:
    app: frontend-coordinadores
  ports:
    - port: 5177
      targetPort: 80
